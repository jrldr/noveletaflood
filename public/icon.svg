<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#083344"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Container with Safe Padding for Maskable Icons -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Technical Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#0e7490" stroke-width="4" stroke-dasharray="8 8" opacity="0.4"/>
  
  <!-- Protective Shield Geometry -->
  <path d="M 256 80 L 390 145 C 390 280 256 400 256 400 C 256 400 122 280 122 145 Z" 
        fill="url(#shieldGrad)" 
        stroke="#22d3ee" 
        stroke-width="12" 
        stroke-linejoin="round"/>
        
  <!-- Hydrologic Wave Layers Inside Shield -->
  <path d="M 160 270 Q 210 240 256 270 T 352 270 L 352 300 C 320 340 256 370 256 370 C 256 370 192 340 160 300 Z" 
        fill="#06b6d4" 
        opacity="0.35"/>
        
  <path d="M 150 240 Q 200 210 256 240 T 362 240 C 362 260 355 285 345 305 Q 300 280 256 280 T 167 305 C 157 285 150 260 150 240 Z" 
        fill="url(#waveGrad)"/>
        
  <!-- Warning / Radar Pulse Center Dot -->
  <circle cx="256" cy="180" r="22" fill="#f43f5e" stroke="#ffffff" stroke-width="6"/>
  <circle cx="256" cy="180" r="38" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6 4" opacity="0.8"/>
</svg>
